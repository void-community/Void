services:
  dashboard:
    image: local/void-demo-dashboard:latest
    pull_policy: never
    build: session/dashboard
    restart: unless-stopped
    networks:
      - default
      - controller_and_dashboard
      - itzg_and_dashboard
  
  client:
    image: ghcr.io/void-community/portable-minecraft-client:latest
    pull_policy: missing
    restart: unless-stopped
    networks:
      - default
      - controller_and_client
    cpus: 4.0
      
  void:
    image: local/void-demo-void:latest
    pull_policy: never
    build: session/void
    restart: unless-stopped
    networks:
      - default
      - itzg_and_void
      - controller_and_void
    environment:
      ARGUMENTS: --offline --ignore-file-servers --server itzg

networks:
  controller_and_client:
    external: true
  controller_and_void:
    external: true
  controller_and_dashboard:
    external: true
  itzg_and_void:
    external: true
  itzg_and_dashboard:
    external: true
