name: "Publish Client Images"

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      minecraft-versions:
        type: string
        required: false
        default: '[]'

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MINECRAFT_VERSIONS: ${{ inputs.minecraft-versions }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            latest|offline)
              jq -e 'type == "array" and length == 0' <<< "$MINECRAFT_VERSIONS" > /dev/null
              ;;
            version)
              jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$MINECRAFT_VERSIONS" > /dev/null
              ;;
            *)
              echo "Unsupported client image target: $TARGET"
              exit 1
              ;;
          esac

      - name: Build and push client images
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MINECRAFT_VERSIONS: ${{ inputs.minecraft-versions }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/portable-minecraft-client
          CACHE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/portable-minecraft-client-buildcache
          FIRST_RELEASE_VERSION: 1.7.2
          MAX_ATTEMPTS: 5
          RETRY_DELAY_SECONDS: 10
          # Fixed epoch for rewrite-timestamp: layers with unchanged content keep their digest across
          # uncached rebuilds, so pulls do not download the multi-gigabyte asset layers again.
          SOURCE_DATE_EPOCH: 0
        run: |
          set -euo pipefail

          multi_platform_image_exists() {
            docker buildx imagetools inspect --raw "$1" 2> /dev/null \
              | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' > /dev/null
          }

          build_and_push() {
            local target="$1"
            local image="$2"
            local minecraft_version="${3:-}"
            local rewrite_timestamps="${4:-true}"
            local assets_image="${5:-}"
            local assets_revision="${6:-}"
            local cache_image="${7:-}"
            local attempt
            local image_output="type=image,name=$image,push=true"

            if [ "$rewrite_timestamps" = true ]; then
              image_output+=",rewrite-timestamp=true"
            fi

            local docker_build_command=(
              docker buildx build
              --platform "linux/amd64,linux/arm64"
              --target "$target"
              --output "$image_output"
              --cache-from "type=registry,ref=$CACHE_REPOSITORY:runtime"
              --cache-to type=inline
            )

            if [ "$target" != offline-assets ] && [ "$target" != version-assets ]; then
              docker_build_command+=(--cache-from "type=registry,ref=$image")
            fi

            case "$target" in
              latest)
                docker_build_command+=(--cache-to "type=registry,ref=$CACHE_REPOSITORY:runtime,mode=max,ignore-error=true")
                ;;
              offline-assets)
                docker_build_command+=(
                  --build-arg "FIRST_RELEASE_VERSION=$FIRST_RELEASE_VERSION"
                  --build-arg "LAST_RELEASE_VERSION=$minecraft_version"
                  --build-arg "OFFLINE_ASSETS_REVISION=$assets_revision"
                  --cache-from "type=registry,ref=$CACHE_REPOSITORY:offline"
                  --cache-from "type=registry,ref=$CACHE_REPOSITORY:offline-assets"
                  --cache-to "type=registry,ref=$CACHE_REPOSITORY:offline-assets,mode=max,ignore-error=true"
                )
                ;;
              offline)
                docker_build_command+=(--build-context "offline-assets=docker-image://$assets_image")
                ;;
              version-assets)
                docker_build_command+=(--build-arg "MINECRAFT_VERSION=$minecraft_version")
                if [ -n "$cache_image" ]; then
                  docker_build_command+=(--cache-from "type=registry,ref=$cache_image")
                fi
                ;;
              version)
                docker_build_command+=(--build-context "version-assets=docker-image://$assets_image")
                ;;
            esac

            docker_build_command+=(src/Client)

            for (( attempt = 1; attempt <= MAX_ATTEMPTS; attempt++ )); do
              if "${docker_build_command[@]}"; then
                return 0
              fi

              if (( attempt == MAX_ATTEMPTS )); then
                echo "Failed to publish $image after $MAX_ATTEMPTS attempts."
                return 1
              fi

              echo "Attempt $attempt failed for $image. Retrying in $(( RETRY_DELAY_SECONDS * attempt )) seconds."
              sleep $(( RETRY_DELAY_SECONDS * attempt ))
            done
          }

          # GitHub Actions supplies the uppercase environment variables used below.
          # shellcheck disable=SC2153
          if [ "$TARGET" = version ]; then
            version_assets_source_revision=$(
              sha256sum \
                src/Client/Dockerfile \
                src/Client/list-minecraft-release-versions \
                src/Client/portablemc-dry-run-with-retries \
                | sha256sum \
                | cut -d ' ' -f 1
            )

            while IFS= read -r minecraft_version; do
              version_image="$IMAGE_REPOSITORY:$minecraft_version"
              version_assets_revision=$(printf '%s\n%s\n' "$version_assets_source_revision" "$minecraft_version" | sha256sum | cut -d ' ' -f 1)
              version_assets_image="$CACHE_REPOSITORY:version-assets-$version_assets_revision"

              if multi_platform_image_exists "$version_assets_image"; then
                echo "Reusing Minecraft $minecraft_version assets image $version_assets_image."
              else
                cache_image=""
                if multi_platform_image_exists "$version_image"; then
                  cache_image="$version_image"
                fi

                build_and_push version-assets "$version_assets_image" "$minecraft_version" true "" "" "$cache_image"
              fi

              build_and_push version "$version_image" "$minecraft_version" false "$version_assets_image"
            done < <(jq -r '.[]' <<< "$MINECRAFT_VERSIONS")
          elif [ "$TARGET" = offline ]; then
            # Publish normalized assets once, then link the changing application layer on top without
            # rewriting the multi-gigabyte asset layers.
            minecraft_versions=$(bash src/Client/list-minecraft-release-versions --json "$FIRST_RELEASE_VERSION")
            last_release_version=$(jq -er '.[-1]' <<< "$minecraft_versions")
            offline_assets_revision=$(
              {
                sha256sum \
                  src/Client/Dockerfile \
                  src/Client/list-minecraft-release-versions \
                  src/Client/portablemc-dry-run-with-retries
                printf '%s\n' "$FIRST_RELEASE_VERSION" "$minecraft_versions"
              } | sha256sum | cut -d ' ' -f 1
            )
            offline_assets_image="$CACHE_REPOSITORY:offline-assets-$offline_assets_revision"

            if multi_platform_image_exists "$offline_assets_image"; then
              echo "Reusing offline assets image $offline_assets_image."
            else
              build_and_push offline-assets "$offline_assets_image" "$last_release_version" true "" "$offline_assets_revision"
            fi

            build_and_push offline "$IMAGE_REPOSITORY:offline" "" false "$offline_assets_image"
          else
            build_and_push "$TARGET" "$IMAGE_REPOSITORY:$TARGET"
          fi
