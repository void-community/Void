on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      release-please:
        type: boolean
        required: false
        default: true
    outputs:
      dotnet-version:
        description: "Generated .NET Version"
        value: ${{ jobs.dev.outputs.dotnet-version }}
      void-version:
        description: "Generated Void Version"
        value: ${{ jobs.release-please.outputs.void-version || jobs.dev.outputs.void-fallback-version }}
      release:
        description: "Release Created"
        value: ${{ jobs.release-please.outputs.release_created == 'true' }}
      tag_name:
        description: "Release Tag Name"
        value: ${{ jobs.release-please.outputs.tag_name }}

env:
  DOTNET_VERSION: ${{ github.event.inputs.dotnet-version || join(fromJSON('["latest"]'), '\n') }}

jobs:
  dev:
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ steps.dotnet-version.outputs.result }}
      void-fallback-version: ${{ steps.void-fallback-version.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set .NET SDK version
        id: dotnet-version
        run: |
          printf 'result<<EOF\n%b\nEOF\n' "$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set Void fallback version
        id: void-fallback-version
        run: |
          base=$(jq -r '.["."]' .github/RELEASE_PLEASE/manifest.json)
          sha=$(git rev-parse --short HEAD)
          echo "result=${base}+${sha}" >> $GITHUB_OUTPUT

  release-please:
    if: ${{ inputs.release-please }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release-again.outputs.release_created }}
      void-version: ${{ steps.release.outputs.version || steps.release-again.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release-again.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # release-please sometimes fails for reasons that pass, such as a GitHub API error, so it gets one more try.
      - name: Create Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json

      - name: Create Release again
        if: ${{ steps.release.outcome == 'failure' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-again
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json