name: "NuGet Workflow"

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      void-version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: "Full version of .NET SDK"
        required: false
        default: 'latest'
      void-version:
        description: "Version to publish"
        required: true

jobs:
  push:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}
      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ inputs.void-version }}
      - name: Pack Api
        run: dotnet pack src/Api --configuration Release --output artifacts /p:Version=${{ inputs.void-version }}
      - name: Pack Minecraft
        run: dotnet pack src/Minecraft --configuration Release --output artifacts /p:Version=${{ inputs.void-version }}
      - name: Rename Artifacts
        shell: bash
        run: mv artifacts/*Api* artifacts/api.nupkg && mv artifacts/*Minecraft* artifacts/minecraft.nupkg
      - name: NuGet Login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: caunt
      - name: NuGet Push
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
      - name: Upload a Pack Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: artifacts
          compression-level: 9
          if-no-files-found: error
