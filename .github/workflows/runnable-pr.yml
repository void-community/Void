name: "PR Workflow"

on:
  pull_request:
  # Runs the same checks on a branch by hand, such as again after a failure that wasn't the branch's.
  workflow_dispatch:

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml
    secrets: inherit
    with:
      release-please: false

  build:
    needs: version
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}

  test-unit:
    needs: [version, build]
    uses: ./.github/workflows/reusable-test.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}
      test-kind: unit

  test-integration:
    needs: version
    uses: ./.github/workflows/reusable-test.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}
      test-kind: integration
