name: "Commit Workflow"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: Full version of .NET SDK
        default: 'latest'
      skip-tests:
        description: Skip running dotnet tests
        default: true
        type: boolean

permissions:
  packages: write
  pages: write
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml
    secrets: inherit
    with:
      dotnet-version: ${{ github.event.inputs.dotnet-version }}

  build:
    needs: version
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}

  test-unit:
    needs: [version, build]
    uses: ./.github/workflows/reusable-test.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}
      skip-tests: ${{ fromJSON(github.event.inputs.skip-tests || 'false') }}
      test-kind: unit

  client-latest:
    needs: build
    uses: ./.github/workflows/reusable-publish-client-images.yml
    secrets: inherit
    with:
      target: latest

  client-offline:
    needs: client-latest
    uses: ./.github/workflows/reusable-publish-client-images.yml
    secrets: inherit
    with:
      target: offline

  client-versions:
    needs: client-latest
    uses: ./.github/workflows/publish-docker-client-versions.yml
    secrets: inherit

  test-integration:
    needs: [version, client-offline]
    uses: ./.github/workflows/reusable-test.yml
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}
      skip-tests: ${{ fromJSON(github.event.inputs.skip-tests || 'false') }}
      test-kind: integration

  github:
    needs: [build,version]
    uses: ./.github/workflows/publish-github.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.version.outputs.tag_name }}
      release: ${{ needs.version.outputs.release }}

  docker:
    needs: [build,version]
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}
      release: ${{ needs.version.outputs.release }}

  nuget:
    needs: [build,version]
    uses: ./.github/workflows/publish-nuget.yml
    if: ${{ fromJSON(needs.version.outputs.release) }}
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
      void-version: ${{ needs.version.outputs.void-version }}

  docs:
    needs: [build,version]
    uses: ./.github/workflows/reusable-docs.yml
    secrets: inherit
    with:
      dotnet-version: ${{ needs.version.outputs.dotnet-version }}
