on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 'latest'
      void-version:
        type: string
        required: true
      skip-tests:
        type: boolean
        required: false
        default: false
      test-kind:
        type: string
        required: false
        default: all
      shard-count:
        type: number
        required: false
        default: 64

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'revert') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'docs') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'style') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'chore') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'refactor') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'build') && !startsWith(github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message, 'ci') }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TEST_KIND: ${{ inputs.test-kind }}
        run: |
          unit_operating_systems='[
            "ubuntu-24.04-arm",
            "ubuntu-latest",
            "macos-latest",
            "macos-15-intel",
            "windows-11-arm",
            "windows-latest"
          ]'
          
          # Do not have docker:
          # macos-latest
          # macos-15-intel
          # windows-11-arm
          
          # Itzg does not support windows:
          # windows-latest
          
          # Testcontainers: "Docker image portableminecraftclient:latest has not been created."
          # ubuntu-24.04-arm
          
          integration_operating_systems='[
            "ubuntu-latest"
          ]'

          case "$TEST_KIND" in
            all)
              ;;
            unit)
              integration_operating_systems='[]'
              ;;
            integration)
              unit_operating_systems='[]'
              ;;
            *)
              echo "Unsupported test kind: $TEST_KIND"
              exit 1
              ;;
          esac
        
          matrix=$(
            jq -cn \
              --argjson unit_operating_systems "$unit_operating_systems" \
              --argjson integration_operating_systems "$integration_operating_systems" \
              --argjson shardCount "${{ inputs.shard-count }}" \
              '{
                include:
                  (
                    [range(0; $shardCount) as $shard | $integration_operating_systems[] as $operating_system | { "test-kind": "integration", "os": $operating_system, "shard": $shard }]
                    +
                    [$unit_operating_systems[] as $unit_operating_systems | { "test-kind": "unit", "os": $unit_operating_systems }]
                  )
              }'
          )
        
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tests:
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
    needs: test-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-quality: ${{ inputs.dotnet-version == 'latest' && 'preview' || '' }}

      - name: Build
        if: ${{ matrix.test-kind == 'unit' }}
        run: dotnet build --configuration Release /p:Version=${{ inputs.void-version }}

      - name: Pull portable-minecraft-client image
        if: ${{ matrix.test-kind == 'integration' }}
        run: docker pull ghcr.io/void-community/portable-minecraft-client:offline

      - name: Create shard filter
        shell: bash
        if: ${{ matrix.test-kind == 'integration' }}
        run: |
          set -euo pipefail

          shard=${{ matrix.shard }}
          total=${{ inputs.shard-count }}
          assignment_dir="$(mktemp -d)"
          tests_file="$assignment_dir/tests.txt"
          discovery_output_file="$assignment_dir/discovery.txt"
          assignments_file="$assignment_dir/assignments.tsv"
          trap 'rm -rf "$assignment_dir"' EXIT

          dotnet test tests/Void.IntegrationTests --configuration Release --list-tests --no-ansi --no-progress \
            | tee "$discovery_output_file"

          awk '
            /^Discovered [0-9]+ tests in assembly - / { started=1; next }
            started && /^  / { sub(/^  /, ""); print; next }
            started { started=0 }
          ' "$discovery_output_file" \
            | LC_ALL=C sort -u > "$tests_file"

          reported_tests=$(awk '/^Discovered [0-9]+ tests in assembly - / { total += $2 } END { print total + 0 }' "$discovery_output_file")
          total_tests=$(wc -l < "$tests_file" | tr -d ' ')

          if [ "$reported_tests" -eq 0 ] || [ "$total_tests" -ne "$reported_tests" ]; then
            echo "Integration test discovery check failed."
            echo "Reported tests: $reported_tests"
            echo "Parsed unique tests: $total_tests"
            exit 1
          fi

          # A collection starts its servers, proxy and games once for all of its tests, so its tests share a shard. A connection test
          # class such as ForgeProxiedPlayerTests_1_12_2 belongs to its server type and protocol version's collection, and any other
          # class is a collection of its own. Weights are a collection's expected minutes times ten; NeoForge has no build before
          # Minecraft 1.20.1, so its older collections only skip.
          paper_weight=30
          forge_weight=35
          neoforge_weight=40
          neoforge_skipped_weight=5
          other_weight=10

          collections_file="$assignment_dir/collections.tsv"
          groups_file="$assignment_dir/groups.tsv"
          declare -a shard_loads shard_collections
          declare -A collection_shards

          while IFS= read -r test_name; do
            test_class=${test_name%.*}
            test_class=${test_class##*.}

            if [[ $test_class =~ ^(Paper|NeoForge|Forge)[A-Za-z]+Tests_([0-9]+(_[0-9]+)*)$ ]]; then
              server_type=${BASH_REMATCH[1]}
              version=${BASH_REMATCH[2]}
              collection="${server_type}_${version}"
              IFS=_ read -r major minor _ <<< "$version"

              case "$server_type" in
                Paper) weight=$paper_weight ;;
                Forge) weight=$forge_weight ;;
                NeoForge)
                  if [ "$major" -eq 1 ] && [ "${minor:-0}" -lt 20 ]; then
                    weight=$neoforge_skipped_weight
                  else
                    weight=$neoforge_weight
                  fi
                  ;;
              esac
            else
              collection=$test_class
              weight=$other_weight
            fi

            printf '%s\t%s\t%s\n' "$weight" "$collection" "$test_name" >> "$collections_file"
          done < "$tests_file"

          # Each collection, heaviest first, goes to the least loaded shard, so every job computes the same assignment.
          cut -f1,2 "$collections_file" | LC_ALL=C sort -t $'\t' -k1,1nr -k2,2 -u > "$groups_file"

          for (( current_shard = 0; current_shard < total; current_shard++ )); do
            : > "$assignment_dir/shard-$current_shard.txt"
            shard_loads[current_shard]=0
            shard_collections[current_shard]=""
          done

          while IFS=$'\t' read -r weight collection; do
            least_loaded_shard=0

            for (( current_shard = 1; current_shard < total; current_shard++ )); do
              if [ "${shard_loads[current_shard]}" -lt "${shard_loads[least_loaded_shard]}" ]; then
                least_loaded_shard=$current_shard
              fi
            done

            collection_shards[$collection]=$least_loaded_shard
            shard_loads[least_loaded_shard]=$(( shard_loads[least_loaded_shard] + weight ))
            shard_collections[least_loaded_shard]="${shard_collections[least_loaded_shard]} $collection"
          done < "$groups_file"

          while IFS=$'\t' read -r _ collection test_name; do
            assigned_shard=${collection_shards[$collection]}

            printf '%s\t%s\n' "$assigned_shard" "$test_name" >> "$assignments_file"
            printf '%s\n' "$test_name" >> "$assignment_dir/shard-$assigned_shard.txt"
          done < "$collections_file"

          assigned_tests=$(wc -l < "$assignments_file" | tr -d ' ')
          unique_assigned_tests=$(cut -f2- "$assignments_file" | LC_ALL=C sort -u | wc -l | tr -d ' ')

          if [ "$assigned_tests" -ne "$total_tests" ] || [ "$unique_assigned_tests" -ne "$total_tests" ]; then
            echo "Shard assignment check failed."
            echo "Discovered tests: $total_tests"
            echo "Assigned tests: $assigned_tests"
            echo "Unique assigned tests: $unique_assigned_tests"
            echo "Duplicate assignments:"
            cut -f2- "$assignments_file" | LC_ALL=C sort | uniq -d
            exit 1
          fi

          echo "Discovered $total_tests integration tests."

          for (( current_shard = 0; current_shard < total; current_shard++ )); do
            shard_tests=$(wc -l < "$assignment_dir/shard-$current_shard.txt" | tr -d ' ')
            echo "Shard $current_shard/$total: $shard_tests tests, load ${shard_loads[current_shard]}:${shard_collections[current_shard]}"
          done

          current_shard_file="$assignment_dir/shard-$shard.txt"

          if [ ! -s "$current_shard_file" ]; then
            echo "No integration tests assigned to shard $shard/$total."
            echo "HAS_INTEGRATION_TESTS=false" >> "$GITHUB_ENV"
            echo "TEST_FILTER=" >> "$GITHUB_ENV"
            exit 0
          fi

          filter=$(awk '{ print "FullyQualifiedName=" $0 }' "$current_shard_file" | paste -sd '|' -)

          echo "HAS_INTEGRATION_TESTS=true" >> "$GITHUB_ENV"
          echo "TEST_FILTER=$filter" >> "$GITHUB_ENV"

      - name: Run integration shard
        if: ${{ matrix.test-kind == 'integration' && env.HAS_INTEGRATION_TESTS == 'true' }}
        env:
          # Clients play the image pulled above, instead of pulling it again for every client.
          VOID_CLIENT_IMAGE: ghcr.io/void-community/portable-minecraft-client:offline
        run: dotnet test tests/Void.IntegrationTests --configuration Release --filter "$TEST_FILTER" --output Detailed

      - name: Skip empty integration shard
        if: ${{ matrix.test-kind == 'integration' && env.HAS_INTEGRATION_TESTS != 'true' }}
        run: echo "No integration tests assigned to this shard."

      - name: Upload integration steps
        if: ${{ always() && matrix.test-kind == 'integration' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-steps-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            steps/**
            **/steps/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Run unit tests
        if: ${{ matrix.test-kind == 'unit' }}
        run: dotnet test tests/Void.UnitTests --verbosity normal
