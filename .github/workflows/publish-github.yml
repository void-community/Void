on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      release:
        type: string
        required: true

jobs:
  push:
    if: ${{ fromJson(inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Compress Plugin DevKit
        run: zip -r -9 artifacts/plugin-devkit.zip pdk
      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag_name }} artifacts/plugin*
          gh release upload ${{ inputs.tag_name }} artifacts/void*
